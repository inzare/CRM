name: consultflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consultflow
      POSTGRES_USER: consultflow
      POSTGRES_PASSWORD: consultflow_local
    ports:
      - '5432:5432'
    volumes:
      - consultflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consultflow -d consultflow']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: consultflow_test
      POSTGRES_USER: consultflow
      POSTGRES_PASSWORD: consultflow_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consultflow -d consultflow_test']
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: npm run db:migrate:deploy
    environment:
      DATABASE_URL: postgresql://consultflow:consultflow_local@postgres:5432/consultflow?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://consultflow:consultflow_local@postgres:5432/consultflow?schema=public
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  consultflow-postgres:
