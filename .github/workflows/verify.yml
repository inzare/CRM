name: Verify
on:
  pull_request:
  push:
    branches: [master, main]
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: consultflow,
            POSTGRES_PASSWORD: consultflow_test,
            POSTGRES_DB: consultflow_test,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U consultflow -d consultflow_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://consultflow:consultflow_test@127.0.0.1:5432/consultflow_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_PEPPER: ci-refresh-pepper-with-at-least-thirty-two-characters
      CORS_ORIGINS: http://127.0.0.1:5173
      EMAIL_PROVIDER: console
      EMAIL_FROM: ci@consultflow.local
      APP_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run build
      - run: npm run openspec:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: apps/api/Dockerfile,
            push: false,
            tags: consultflow-api:verify,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: apps/web/Dockerfile,
            push: false,
            tags: consultflow-web:verify,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
