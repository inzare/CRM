name: Publish API image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: read, id-token: write }
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          {
            role-to-assume: '${{ secrets.AWS_PUBLISH_ROLE_ARN }}',
            aws-region: '${{ vars.AWS_REGION }}',
          }
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: '${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}'
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text
